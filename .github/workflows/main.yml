
name: Build MyLifeManager APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unzip Android project
        run: |
          mkdir -p source
          unzip MyLifeManagerAndroid_Source.zip -d source

      - name: Build APK
        working-directory: source/MyLifeManagerAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyLifeManager-APK
          path: source/MyLifeManagerAndroid/app/build/outputs/apk/debug/*.apk
          
